name = "imobi-api"
main = "src/index.ts"
compatibility_date = "2024-07-26"

# Substitua pelos valores da sua conta Cloudflare
account_id = "533aa092c7f3571e13fdc103ba716bdf"

# Worker já existente; `wrangler deploy` manterá o nome e a URL.
# Para publicar em domínio próprio, configure routes ou workers_dev = false.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "imobi-production"
database_id = "ab48142f-0360-4ed1-9213-2759796e260d"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "imobi-media"

[vars]
JWT_SECRET = "imobi-jwt-secret-2026-7d9f4a2b1e8c5d0a3f6b9e2c7d4a1f0b"

# Secrets sensíveis devem ser definidos via `wrangler secret put`:
# - JWT_SECRET (recomendado ao invés de var pública)
